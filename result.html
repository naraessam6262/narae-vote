<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나래반 국회 투표 결과</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

  :root {
    --na-blue: #0d2245;
    --na-blue-mid: #1a3a6e;
    --na-gold: #c8993a;
    --na-green: #1e8c45;
    --na-yellow: #e6a800;
    --na-red: #c0392b;
    --na-light: #eef2f8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--na-blue);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px 40px;
  }

  /* 헤더 */
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header .emblem { font-size: 36px; margin-bottom: 4px; }
  .header h1 {
    color: #fff;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.3px;
  }
  .header .topic-box {
    margin-top: 10px;
    background: rgba(200,153,58,0.18);
    border: 1.5px solid var(--na-gold);
    border-radius: 10px;
    padding: 10px 20px;
    color: #f0d998;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.5;
  }

  /* 카운터 바 */
  .counter-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 22px;
    width: 100%;
    max-width: 600px;
  }
  .counter {
    flex: 1;
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
    font-weight: 900;
  }
  .counter .count { font-size: 32px; line-height: 1; }
  .counter .label { font-size: 13px; margin-top: 4px; opacity: 0.9; }
  .c-yes  { background: var(--na-green); color: #fff; }
  .c-abs  { background: var(--na-yellow); color: #fff; }
  .c-no   { background: var(--na-red); color: #fff; }
  .c-wait { background: rgba(255,255,255,0.08); color: #8a9ab5; border: 1px solid rgba(255,255,255,0.12); }

  /* 의석 반원 */
  .assembly-wrap {
    width: 100%;
    max-width: 600px;
    position: relative;
    margin-bottom: 20px;
  }

  .assembly-svg-wrap {
    width: 100%;
    overflow: visible;
  }

  /* 결과 바 */
  .result-bar-wrap {
    width: 100%;
    max-width: 600px;
    margin-bottom: 24px;
  }
  .result-bar-bg {
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    height: 24px;
    overflow: hidden;
    display: flex;
  }
  .rb-yes { background: var(--na-green); transition: width 0.5s; }
  .rb-abs { background: var(--na-yellow); transition: width 0.5s; }
  .rb-no  { background: var(--na-red); transition: width 0.5s; }
  .bar-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 12px;
    color: #8a9ab5;
  }
  .bar-labels span { font-weight: 700; }

  /* 범례 */
  .legend {
    display: flex;
    gap: 20px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .leg-item { display: flex; align-items: center; gap: 8px; color: #aac0df; font-size: 13px; }
  .leg-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 900; color: #fff;
  }
  .ld-yes { background: var(--na-green); }
  .ld-abs { background: var(--na-yellow); }
  .ld-no  { background: var(--na-red); }
  .ld-wait { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); }

  /* 결과 발표 버튼 */
  .announce-btn {
    background: var(--na-gold);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px 32px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    transition: 0.18s;
    margin-bottom: 12px;
  }
  .announce-btn:hover { background: #b08830; }

  .reset-btn {
    background: transparent;
    color: #8a9ab5;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 8px 20px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }
  .reset-btn:hover { color: #fff; border-color: rgba(255,255,255,0.35); }

  /* 결과 발표 오버레이 */
  .announce-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .announce-overlay.show { display: flex; }
  .announce-card {
    background: var(--na-blue-mid);
    border: 2px solid var(--na-gold);
    border-radius: 24px;
    padding: 40px 50px;
    text-align: center;
    max-width: 420px;
    width: 90%;
  }
  .announce-emoji { font-size: 60px; margin-bottom: 16px; }
  .announce-result { color: var(--na-gold); font-size: 22px; font-weight: 900; margin-bottom: 8px; }
  .announce-detail { color: #dce7f5; font-size: 15px; line-height: 1.7; margin-bottom: 24px; }
  .close-overlay-btn {
    background: var(--na-gold); color: #fff; border: none;
    border-radius: 10px; padding: 12px 28px;
    font-family: 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="header">
  <div class="emblem">🏛</div>
  <h1>나래반 국회 — 실시간 투표 현황</h1>
  <div class="topic-box">
    "촉법소년 연령 기준을 현행 만 14세에서<br><strong>만 13세로 낮춰야 한다</strong>"
  </div>
</div>

<!-- 카운터 -->
<div class="counter-bar">
  <div class="counter c-yes">
    <div class="count" id="cntYes">0</div>
    <div class="label">✅ 찬성</div>
  </div>
  <div class="counter c-abs">
    <div class="count" id="cntAbs">0</div>
    <div class="label">🟡 기권</div>
  </div>
  <div class="counter c-no">
    <div class="count" id="cntNo">0</div>
    <div class="label">❌ 반대</div>
  </div>
  <div class="counter c-wait">
    <div class="count" id="cntWait">16</div>
    <div class="label">⏳ 미투표</div>
  </div>
</div>

<!-- 의석 반원 SVG -->
<div class="assembly-wrap">
  <svg class="assembly-svg-wrap" viewBox="0 0 600 330" xmlns="http://www.w3.org/2000/svg" id="assemblySvg">
    <!-- 단상 -->
    <rect x="240" y="270" width="120" height="40" rx="8" fill="#1a3a6e" stroke="#c8993a" stroke-width="2"/>
    <text x="300" y="296" text-anchor="middle" fill="#c8993a" font-family="Noto Sans KR, sans-serif" font-size="14" font-weight="700">의장석</text>
    <!-- 의석들은 JS로 생성 -->
  </svg>
</div>

<!-- 범례 -->
<div class="legend">
  <div class="leg-item"><div class="leg-dot ld-yes">✓</div> 찬성</div>
  <div class="leg-item"><div class="leg-dot ld-abs">−</div> 기권</div>
  <div class="leg-item"><div class="leg-dot ld-no">✕</div> 반대</div>
  <div class="leg-item"><div class="leg-dot ld-wait"></div> 미투표</div>
</div>

<!-- 결과 바 -->
<div class="result-bar-wrap">
  <div class="result-bar-bg">
    <div class="rb-yes" id="rbYes" style="width:0%"></div>
    <div class="rb-abs" id="rbAbs" style="width:0%"></div>
    <div class="rb-no"  id="rbNo"  style="width:0%"></div>
  </div>
  <div class="bar-labels">
    <span id="lbYes" style="color:#1e8c45">찬성 0명</span>
    <span id="lbAbs" style="color:#e6a800">기권 0명</span>
    <span id="lbNo"  style="color:#c0392b">반대 0명</span>
  </div>
</div>

<button class="announce-btn" onclick="announce()">📣 최종 결과 발표</button>
<button class="reset-btn" onclick="resetVotes()">투표 초기화</button>

<!-- 결과 발표 오버레이 -->
<div class="announce-overlay" id="announceOverlay">
  <div class="announce-card">
    <div class="announce-emoji" id="announceEmoji">🗳</div>
    <div class="announce-result" id="announceResult">결과 발표</div>
    <div class="announce-detail" id="announceDetail"></div>
    <button class="close-overlay-btn" onclick="document.getElementById('announceOverlay').classList.remove('show')">닫기</button>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
    apiKey: "AIzaSyAhczWNVfjKxJc0L-gsmzY7DPa9qk_Rm2g",
    authDomain: "narae-vote.firebaseapp.com",
    databaseURL: "https://narae-vote-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "narae-vote",
    storageBucket: "narae-vote.firebasestorage.app",
    messagingSenderId: "130499109130",
    appId: "1:130499109130:web:d7f677fcd31439df111af3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window._db = db;
  window._ref = ref;
  window._remove = remove;

  // 실시간 리스너
  onValue(ref(db, 'vote2025/seats'), (snapshot) => {
    const data = snapshot.val() || {};
    window.updateUI(data);
  });
</script>

<script>
  // 의석 좌표 계산 (반원형 3줄)
  // 중심 (300, 280), 반지름 90/150/210
  const ROWS = [
    { r: 90,  n: 4,  startAngle: 200, endAngle: 340 },
    { r: 150, n: 6,  startAngle: 195, endAngle: 345 },
    { r: 210, n: 6,  startAngle: 195, endAngle: 345 },
  ];

  const CX = 300, CY = 280;
  let seatOrder = []; // 좌에서 우로 번호 매핑

  function buildSeats() {
    const svg = document.getElementById('assemblySvg');
    let allSeats = [];

    ROWS.forEach(row => {
      const step = (row.endAngle - row.startAngle) / (row.n - 1);
      for (let i = 0; i < row.n; i++) {
        const deg = row.startAngle + step * i;
        const rad = (deg * Math.PI) / 180;
        const x = CX + row.r * Math.cos(rad);
        const y = CY + row.r * Math.sin(rad);
        allSeats.push({ x, y });
      }
    });

    // 좌→우 정렬 후 번호 부여 (x 기준 오름차순)
    allSeats.sort((a, b) => a.x - b.x);

    allSeats.forEach((seat, idx) => {
      const num = idx + 1;
      seatOrder.push({ num, x: seat.x, y: seat.y });

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.id = `seat-${num}`;
      g.setAttribute('transform', `translate(${seat.x.toFixed(1)}, ${seat.y.toFixed(1)})`);

      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('r', '22');
      circle.setAttribute('fill', 'rgba(255,255,255,0.07)');
      circle.setAttribute('stroke', 'rgba(255,255,255,0.2)');
      circle.setAttribute('stroke-width', '1.5');
      circle.id = `seat-circle-${num}`;

      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('dominant-baseline', 'central');
      text.setAttribute('fill', '#8a9ab5');
      text.setAttribute('font-family', 'Noto Sans KR, sans-serif');
      text.setAttribute('font-size', '13');
      text.setAttribute('font-weight', '700');
      text.textContent = num;
      text.id = `seat-text-${num}`;

      g.appendChild(circle);
      g.appendChild(text);
      svg.appendChild(g);
    });
  }

  buildSeats();

  // 의석 색상 업데이트
  const COLORS = {
    yes:  { fill: '#1e8c45', stroke: '#16703a', text: '#fff' },
    abs:  { fill: '#e6a800', stroke: '#cc9500', text: '#fff' },
    no:   { fill: '#c0392b', stroke: '#a93226', text: '#fff' },
    wait: { fill: 'rgba(255,255,255,0.07)', stroke: 'rgba(255,255,255,0.2)', text: '#8a9ab5' },
  };

  window.updateUI = function(data) {
    let yes = 0, abs = 0, no = 0;

    for (let i = 1; i <= 16; i++) {
      const vote = data[i] || 'wait';
      const c = COLORS[vote] || COLORS.wait;

      const circle = document.getElementById(`seat-circle-${i}`);
      const text   = document.getElementById(`seat-text-${i}`);

      if (circle) {
        circle.setAttribute('fill', c.fill);
        circle.setAttribute('stroke', c.stroke);
        // 투표 완료 시 약간 크게
        circle.setAttribute('r', vote !== 'wait' ? '24' : '22');
      }
      if (text) {
        text.setAttribute('fill', c.text);
      }

      if (vote === 'yes') yes++;
      else if (vote === 'abs') abs++;
      else if (vote === 'no') no++;
    }

    const wait = 16 - yes - abs - no;
    const total = yes + abs + no || 1;

    document.getElementById('cntYes').textContent  = yes;
    document.getElementById('cntAbs').textContent  = abs;
    document.getElementById('cntNo').textContent   = no;
    document.getElementById('cntWait').textContent = wait;

    document.getElementById('rbYes').style.width = (yes  / 16 * 100).toFixed(1) + '%';
    document.getElementById('rbAbs').style.width = (abs  / 16 * 100).toFixed(1) + '%';
    document.getElementById('rbNo').style.width  = (no   / 16 * 100).toFixed(1) + '%';

    document.getElementById('lbYes').textContent = `찬성 ${yes}명`;
    document.getElementById('lbAbs').textContent = `기권 ${abs}명`;
    document.getElementById('lbNo').textContent  = `반대 ${no}명`;

    // 전역 저장
    window._counts = { yes, abs, no, wait };
  };

  window.announce = function() {
    const c = window._counts || { yes: 0, abs: 0, no: 0 };
    const overlay = document.getElementById('announceOverlay');
    let emoji, result, detail;

    const voted = c.yes + c.abs + c.no;
    if (voted < 16) {
      emoji = '⏳'; result = '아직 투표 중!';
      detail = `현재 ${voted}명 투표 완료\n${16 - voted}명 미투표`;
    } else if (c.yes > c.no) {
      emoji = '✅'; result = '찬성 가결!';
      detail = `찬성 ${c.yes}명 · 기권 ${c.abs}명 · 반대 ${c.no}명\n\n나래반 국회는 법안을 가결하였습니다.`;
    } else if (c.no > c.yes) {
      emoji = '❌'; result = '반대 부결!';
      detail = `찬성 ${c.yes}명 · 기권 ${c.abs}명 · 반대 ${c.no}명\n\n나래반 국회는 법안을 부결하였습니다.`;
    } else {
      emoji = '🟡'; result = '동수 — 의장 결정!';
      detail = `찬성 ${c.yes}명 = 반대 ${c.no}명\n기권 ${c.abs}명\n\n의장의 결정이 필요합니다.`;
    }

    document.getElementById('announceEmoji').textContent  = emoji;
    document.getElementById('announceResult').textContent = result;
    document.getElementById('announceDetail').textContent = detail;
    overlay.classList.add('show');
  };

  window.resetVotes = function() {
    if (!confirm('투표를 초기화할까요?')) return;
    const db = window._db;
    if (db) {
      window._remove(window._ref(db, 'vote2025/seats'))
        .then(() => window.updateUI({}));
    } else {
      window.updateUI({});
    }
  };

  // Firebase 없을 때 데모 데이터로 테스트
  if (!window._db) {
    window.updateUI({});
  }
</script>
</body>
</html>
