<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나래반 국회 — 선생님 화면</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

  :root {
    --blue: #1a3a6e;
    --blue-dark: #0d2245;
    --gold: #c8993a;
    --green: #1e8c45;
    --red: #c0392b;
    --yellow: #e6a800;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--blue-dark);
    height: 100%;
    overflow: hidden;
  }

  /* 전체 레이아웃: 네비 + 콘텐츠 꽉 채우기 */
  .page {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* 네비 */
  .nav {
    background: var(--blue);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 2px solid var(--gold);
    flex-shrink: 0;
  }
  .nav .emblem { font-size: 22px; }
  .nav h1 { color: #fff; font-size: 16px; font-weight: 900; flex: 1; }
  .tab-btns { display: flex; gap: 6px; }
  .tab-btn {
    padding: 6px 16px; border-radius: 20px;
    border: 1.5px solid rgba(255,255,255,0.25);
    background: transparent; color: #aac0df;
    font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .tab-btn.active { background: var(--gold); border-color: var(--gold); color: #fff; }

  /* 탭 패널 */
  .tab-panel { display: none; flex: 1; overflow: hidden; }
  .tab-panel.show { display: flex; flex-direction: column; }

  /* ===== 투표 탭 ===== */
  #tab-vote {
    padding: 10px 40px 10px;
  }

  /* 카운터 */
  .count-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    flex-shrink: 0;
    margin-bottom: 10px;
  }
  .cnt-card { border-radius: 10px; padding: 10px; text-align: center; }
  .cnt-card .n { font-size: 30px; font-weight: 900; line-height: 1; }
  .cnt-card .l { font-size: 12px; margin-top: 3px; opacity: 0.9; }
  .cc-yes  { background: var(--green); color: #fff; }
  .cc-abs  { background: var(--yellow); color: #fff; }
  .cc-no   { background: var(--red); color: #fff; }
  .cc-wait { background: rgba(255,255,255,0.08); color: #8a9ab5; border: 1px solid rgba(255,255,255,0.15); }

  /* 범례 */
  .legend-row {
    display: flex; gap: 18px; flex-shrink: 0;
    margin-bottom: 8px;
  }
  .leg { display: flex; align-items: center; gap: 5px; color: #8a9ab5; font-size: 12px; }
  .ld { width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 900; color: #fff; }
  .ld-g { background: var(--green); }
  .ld-y { background: var(--yellow); }
  .ld-r { background: var(--red); }
  .ld-w { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); }

  /* SVG 영역 — 남은 공간 꽉 채우기 */
  .svg-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .svg-wrap svg {
    width: 100%;
    height: 100%;
    max-height: 100%;
  }

  /* 하단 버튼 */
  .bottom-btns {
    display: flex; gap: 10px; flex-shrink: 0;
    padding-top: 8px;
  }
  .announce-btn {
    flex: 1; padding: 12px;
    border-radius: 10px; border: none;
    background: var(--gold); color: #fff;
    font-family: 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 900; cursor: pointer;
  }
  .reset-btn {
    padding: 12px 20px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: transparent; color: #8a9ab5;
    font-family: 'Noto Sans KR', sans-serif; font-size: 13px; cursor: pointer;
  }

  /* ===== 의견 탭 ===== */
  #tab-opinion {
    padding: 12px 16px 10px;
  }

  .topic-banner {
    background: var(--blue); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 10px;
    border-left: 4px solid var(--gold);
    color: #fff; font-size: 13px; font-weight: 700; line-height: 1.5;
    flex-shrink: 0;
  }
  .topic-banner span { color: var(--gold); font-size: 11px; letter-spacing: 1px; display: block; margin-bottom: 2px; }

  /* 두 컬럼 */
  .two-col {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; flex: 1; min-height: 0;
  }
  .col-panel {
    display: flex; flex-direction: column;
    min-height: 0; border-radius: 12px; overflow: hidden;
  }
  .col-header {
    padding: 10px 14px; font-size: 14px; font-weight: 900;
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .col-header.yes { background: var(--green); color: #fff; }
  .col-header.no  { background: var(--red);   color: #fff; }
  .col-cnt {
    margin-left: auto; background: rgba(255,255,255,0.25);
    border-radius: 20px; padding: 2px 10px; font-size: 13px;
  }
  .col-cards {
    flex: 1; overflow-y: auto;
    background: rgba(255,255,255,0.05);
    padding: 8px; display: flex; flex-direction: column; gap: 8px;
  }
  .op-card { background: #fff; border-radius: 10px; padding: 12px; animation: fadeIn 0.25s ease; }
  .op-card.stance-yes { border-left: 4px solid var(--green); }
  .op-card.stance-no  { border-left: 4px solid var(--red); }
  @keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; } }

  .op-header { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
  .op-num {
    background: var(--blue); color: #fff; border-radius: 50%;
    width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 900; flex-shrink: 0;
  }
  .op-stance-badge { border-radius: 20px; padding: 2px 8px; font-size: 10px; font-weight: 700; }
  .op-stance-badge.yes { background: #f0faf5; color: var(--green); border: 1px solid var(--green); }
  .op-stance-badge.no  { background: #fdf2f2; color: var(--red);   border: 1px solid var(--red); }
  .op-text { font-size: 13px; color: #374151; line-height: 1.6; margin-bottom: 8px; }
  .like-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: #f8fafc; border: 1.5px solid #e2e8f0;
    border-radius: 20px; padding: 4px 11px;
    font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 700; color: #64748b; cursor: pointer;
  }
  .like-btn:hover, .like-btn.liked { background: #fdf2fb; border-color: #f9a8d4; color: #be185d; }
  .no-opinions { text-align: center; padding: 30px; color: #8a9ab5; font-size: 13px; }

  /* 결과 오버레이 */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.88); z-index: 200;
    align-items: center; justify-content: center;
  }
  .overlay.show { display: flex; }
  .ov-card {
    background: var(--blue); border: 2.5px solid var(--gold);
    border-radius: 22px; padding: 40px 48px; text-align: center; max-width: 420px; width: 90%;
  }
  .ov-emoji { font-size: 56px; margin-bottom: 14px; }
  .ov-result { color: var(--gold); font-size: 24px; font-weight: 900; margin-bottom: 10px; }
  .ov-detail { color: #dce7f5; font-size: 15px; line-height: 1.8; margin-bottom: 22px; white-space: pre-line; }
  .ov-close {
    background: var(--gold); color: #fff; border: none;
    border-radius: 10px; padding: 12px 28px;
    font-family: 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>
<div class="page">

  <div class="nav">
    <div class="emblem">🏛</div>
    <h1>나래반 국회 — 선생님 화면</h1>
    <div class="tab-btns">
      <button class="tab-btn active" onclick="switchTab('vote',this)">🗳 투표</button>
      <button class="tab-btn" onclick="switchTab('opinion',this)">💬 의견</button>
    </div>
  </div>

  <!-- 투표 탭 -->
  <div class="tab-panel show" id="tab-vote">

    <div class="count-row">
      <div class="cnt-card cc-yes"><div class="n" id="cntYes">0</div><div class="l">✅ 찬성</div></div>
      <div class="cnt-card cc-abs"><div class="n" id="cntAbs">0</div><div class="l">🟡 기권</div></div>
      <div class="cnt-card cc-no" ><div class="n" id="cntNo" >0</div><div class="l">❌ 반대</div></div>
      <div class="cnt-card cc-wait"><div class="n" id="cntWait">16</div><div class="l">⏳ 미투표</div></div>
    </div>

    <div class="legend-row">
      <div class="leg"><div class="ld ld-g">✓</div> 찬성</div>
      <div class="leg"><div class="ld ld-y">−</div> 기권</div>
      <div class="leg"><div class="ld ld-r">✕</div> 반대</div>
      <div class="leg"><div class="ld ld-w"></div> 미투표</div>
    </div>

    <div class="svg-wrap">
      <svg id="assemblySvg" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <!-- 의장석 -->
        <rect x="375" y="305" width="150" height="40" rx="8" fill="#1a3a6e" stroke="#c8993a" stroke-width="2"/>
        <text x="450" y="330" text-anchor="middle" fill="#c8993a" font-family="Noto Sans KR,sans-serif" font-size="16" font-weight="700">의장석</text>
        <!-- 의석은 JS로 생성 -->
      </svg>
    </div>

    <div class="bottom-btns">
      <button class="announce-btn" onclick="announce()">📣 결과 발표</button>
      <button class="reset-btn" onclick="resetVotes()">초기화</button>
    </div>

  </div>

  <!-- 의견 탭 -->
  <div class="tab-panel" id="tab-opinion">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-shrink:0;">
      <div class="topic-banner" style="margin:0;flex:1;">
        <span>오늘의 토론 주제</span>
        "촉법소년 연령 기준을 현행 만 14세에서 만 13세로 낮춰야 한다"
      </div>
      <button class="reset-btn" onclick="resetOpinions()" style="flex-shrink:0;white-space:nowrap;">🗑 의견 초기화</button>
    </div>
    <div class="two-col">
      <div class="col-panel">
        <div class="col-header yes">✅ 낮춰야 한다 <span class="col-cnt" id="cntOpYes">0</span></div>
        <div class="col-cards" id="colYes"><div class="no-opinions">아직 없어요</div></div>
      </div>
      <div class="col-panel">
        <div class="col-header no">🚫 반대한다 <span class="col-cnt" id="cntOpNo">0</span></div>
        <div class="col-cards" id="colNo"><div class="no-opinions">아직 없어요</div></div>
      </div>
    </div>
  </div>

</div>

<!-- 결과 오버레이 -->
<div class="overlay" id="overlay">
  <div class="ov-card">
    <div class="ov-emoji"  id="ovEmoji">🗳</div>
    <div class="ov-result" id="ovResult">결과</div>
    <div class="ov-detail" id="ovDetail"></div>
    <button class="ov-close" onclick="document.getElementById('overlay').classList.remove('show')">닫기</button>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAhczWNVfjKxJc0L-gsmzY7DPa9qk_Rm2g",
    authDomain: "narae-vote.firebaseapp.com",
    databaseURL: "https://narae-vote-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "narae-vote",
    storageBucket: "narae-vote.firebasestorage.app",
    messagingSenderId: "130499109130",
    appId: "1:130499109130:web:d7f677fcd31439df111af3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  window._db = db;
  window._ref = ref;
  window._update = update;
  window._remove = remove;

  onValue(ref(db, 'debate2025/opinions'), snap => {
    window._opinions = snap.val() || {};
    window.renderOpinions();
  });

  onValue(ref(db, 'vote2025/seats'), snap => {
    window.updateSeats(snap.val() || {});
  });
</script>

<script>
  // ===== 탭 =====
  function switchTab(name, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('show'));
    document.getElementById('tab-' + name).classList.add('show');
  }

  // ===== 의석 배치 =====
  // 반원형: 중심(450, 440), 3줄
  // 번호는 왼쪽→오른쪽, 안쪽→바깥쪽 순서
  const CX = 450, CY = 320;
  const ROWS = [
    { r: 90,  count: 4 },
    { r: 160, count: 6 },
    { r: 230, count: 6 },
  ];

  (function buildSeats() {
    const svg = document.getElementById('assemblySvg');
    // 각 줄별로 왼→오른 순서로 번호 부여
    // 줄1(앞줄 4개): 1~4, 줄2(중간 6개): 5~10, 줄3(뒷줄 6개): 11~16
    let num = 1;

    ROWS.forEach(row => {
      // 반원: 180도~0도 (왼쪽→오른쪽)
      const seats = [];
      for (let i = 0; i < row.count; i++) {
        const deg = 180 - (180 / (row.count - 1)) * i;
        const rad = deg * Math.PI / 180;
        seats.push({
          x: CX + row.r * Math.cos(rad),
          y: CY + row.r * Math.sin(rad)
        });
      }

      seats.forEach(seat => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('transform', `translate(${seat.x.toFixed(1)},${seat.y.toFixed(1)})`);

        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', '26');
        c.setAttribute('fill', 'rgba(255,255,255,0.07)');
        c.setAttribute('stroke', 'rgba(255,255,255,0.25)');
        c.setAttribute('stroke-width', '2');
        c.id = `sc-${num}`;

        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('dominant-baseline', 'central');
        t.setAttribute('fill', '#8a9ab5');
        t.setAttribute('font-family', 'Noto Sans KR, sans-serif');
        t.setAttribute('font-size', '14');
        t.setAttribute('font-weight', '700');
        t.textContent = num;
        t.id = `st-${num}`;

        g.appendChild(c);
        g.appendChild(t);
        svg.appendChild(g);
        num++;
      });
    });
  })();

  const COLORS = {
    yes:  { fill: '#1e8c45', stroke: '#16703a', text: '#fff', r: '29' },
    abs:  { fill: '#e6a800', stroke: '#cc9500', text: '#fff', r: '29' },
    no:   { fill: '#c0392b', stroke: '#a93226', text: '#fff', r: '29' },
    wait: { fill: 'rgba(255,255,255,0.07)', stroke: 'rgba(255,255,255,0.25)', text: '#8a9ab5', r: '26' },
  };

  window.updateSeats = function(data) {
    let yes=0, abs=0, no=0;
    for (let i=1; i<=16; i++) {
      const v = data[i] || 'wait';
      const c = COLORS[v] || COLORS.wait;
      const sc = document.getElementById(`sc-${i}`);
      const st = document.getElementById(`st-${i}`);
      if (sc) { sc.setAttribute('fill', c.fill); sc.setAttribute('stroke', c.stroke); sc.setAttribute('r', c.r); }
      if (st) { st.setAttribute('fill', c.text); }
      if (v==='yes') yes++;
      else if (v==='abs') abs++;
      else if (v==='no') no++;
    }
    const wait = 16-yes-abs-no;
    document.getElementById('cntYes').textContent  = yes;
    document.getElementById('cntAbs').textContent  = abs;
    document.getElementById('cntNo').textContent   = no;
    document.getElementById('cntWait').textContent = wait;
    window._vCounts = { yes, abs, no, wait };
  };

  window.announce = function() {
    const c = window._vCounts || { yes:0, abs:0, no:0 };
    const voted = c.yes + c.abs + c.no;
    let emoji, result, detail;

    if (voted < 16) {
      emoji='⏳'; result='투표 진행 중';
      detail=`현재 ${voted}명 완료\n${16-voted}명 미투표`;
    } else if (c.yes > c.no) {
      emoji='✅'; result='찬성 가결!';
      detail=`찬성 ${c.yes}명 · 기권 ${c.abs}명 · 반대 ${c.no}명\n\n나래반 국회는 법안을 가결했습니다!`;
    } else if (c.no > c.yes) {
      emoji='❌'; result='반대 부결!';
      detail=`찬성 ${c.yes}명 · 기권 ${c.abs}명 · 반대 ${c.no}명\n\n나래반 국회는 법안을 부결했습니다.`;
    } else {
      emoji='🟡'; result='동수 — 의장 결정 필요!';
      detail=`찬성 ${c.yes}명 = 반대 ${c.no}명\n기권 ${c.abs}명`;
    }

    document.getElementById('ovEmoji').textContent  = emoji;
    document.getElementById('ovResult').textContent = result;
    document.getElementById('ovDetail').textContent = detail;
    document.getElementById('overlay').classList.add('show');
  };

  window.resetVotes = function() {
    if (!confirm('투표를 초기화할까요?')) return;
    if (window._db) {
      window._remove(window._ref(window._db, 'vote2025/seats'))
        .then(() => window.updateSeats({}));
    }
  };

  // ===== 의견 =====
  window._opinions = {};
  window._liked = {};

  window.renderOpinions = function() {
    const ops = window._opinions;
    const keys = Object.keys(ops);

    const yesKeys = keys.filter(k => ops[k].stance === 'yes').sort((a,b) => (ops[b].likes||0)-(ops[a].likes||0));
    const noKeys  = keys.filter(k => ops[k].stance === 'no').sort((a,b)  => (ops[b].likes||0)-(ops[a].likes||0));

    document.getElementById('cntOpYes').textContent = yesKeys.length;
    document.getElementById('cntOpNo').textContent  = noKeys.length;

    renderCol('colYes', yesKeys, ops);
    renderCol('colNo',  noKeys,  ops);
  };

  function renderCol(colId, keys, ops) {
    const col = document.getElementById(colId);
    if (keys.length === 0) {
      col.innerHTML = '<div class="no-opinions">아직 없어요</div>';
      return;
    }
    col.innerHTML = '';
    keys.forEach(k => {
      const op = ops[k];
      const liked = window._liked[k];
      const card = document.createElement('div');
      card.className = `op-card stance-${op.stance}`;
      card.innerHTML = `
        <div class="op-header">
          <div class="op-num">${op.num}</div>
          <div class="op-stance-badge ${op.stance}">${op.stance==='yes' ? '✅ 낮춰야' : '🚫 반대'}</div>
        </div>
        <div class="op-text">${esc(op.text)}</div>
        <button class="like-btn ${liked?'liked':''}" onclick="toggleLike('${k}',this)">
          ${liked?'💙':'🤍'} ${op.likes||0}
        </button>`;
      col.appendChild(card);
    });
  }

  window.resetOpinions = function() {
    if (!confirm('의견을 모두 초기화할까요?')) return;
    if (window._db) {
      window._remove(window._ref(window._db, 'debate2025/opinions'))
        .then(() => { window._opinions = {}; window.renderOpinions(); });
    }
  };

  function toggleLike(key, btn) {
    const op = (window._opinions||{})[key];
    if (!op) return;
    const already = window._liked[key];
    const newLikes = already ? Math.max(0,(op.likes||0)-1) : (op.likes||0)+1;
    window._liked[key] = !already;
    if (window._db) {
      window._update(window._ref(window._db, `debate2025/opinions/${key}`), { likes: newLikes });
    }
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  window.switchTab = switchTab;
  window.toggleLike = toggleLike;
</script>
</body>
</html>
